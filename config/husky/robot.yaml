# Clearpath Husky A200 configuration used by the Gazebo Fortress spawner.
serial_number: a200-0000
version: 0
system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: /
platform:
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
  extras:
    urdf:
      package: rough_terrain_sim
      path: urdf/husky_ouster_os1_128.urdf.xacro

sensors:
  camera:
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_front_mount
      xyz: [0.0, 0.0, 0.05]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        camera:
          camera_name: camera_0
          device_type: d435
          serial_no: '0'
          enable_color: true
          rgb_camera.profile: 640,480,30
          enable_depth: true
          depth_module.profile: 640,480,30
          pointcloud.enable: true

  # The active 128-channel Ouster is defined by platform.extras.urdf above.
  # Its Gazebo-to-ROS bridge is started by rough_terrain.launch.py.
  lidar3d:
    # - model: velodyne_lidar
    #   urdf_enabled: true
    #   launch_enabled: true
    #   parent: default_mount
    #   xyz: [0.0, 0.0, 0.2]
    #   rpy: [0.0, 0.0, 0.0]
    #   ros_parameters:
    #     velodyne_driver_node:
    #       frame_id: lidar3d_0_laser
    #       model: VLP16
    #     velodyne_transform_node:
    #       model: VLP16
    #       fixed_frame: lidar3d_0_laser
    #       target_frame: lidar3d_0_laser
    []
