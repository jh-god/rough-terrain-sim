# Clearpath Husky A200 configuration used by the Gazebo Fortress spawner.
serial_number: a200-0000
version: 0
system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: /
platform:
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
    - name: sensor_arch
      type: a200.sensor_arch
      parent: default_mount
      model: sensor_arch_300
      enabled: true
  extras:
    urdf:
      package: rough_terrain_sim
      path: urdf/husky_ouster_os1_128.urdf.xacro

mounts:
  disk:
    - parent: sensor_arch_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]

sensors:
  imu:
    - model: microstrain_imu
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_default_mount
      xyz: [0.0, 0.0, 0.00]
      rpy: [0.0, 0.0, 0.0]
  camera:
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: top_plate_front_mount
      xyz: [0.0, 0.0, 0.05]
      rpy: [0.0, 0.785398, 0.0] 
      ros_parameters:
        camera:
          camera_name: camera_0
          device_type: d435i
          serial_no: '0'
          enable_color: true
          rgb_camera.profile: 640,480,30
          enable_depth: true
          depth_module.profile: 640,480,30
          pointcloud.enable: true
